# AII sidecar — InstituteOS metadata. Schema: instituteos.platform.aii_sidecar.models.AiiSidecar (aii-sidecar/v1)
schema: aii-sidecar/v1

meta:
  sidecar_version: 1.0.0
  updated: 2026-11-01

repo:
  name: ATLAS
  slug: atlas
  full_name: ActiveInferenceInstitute/ATLAS
  description: Knowledge management system and project materials repository of the Active Inference Institute.
  default_branch: main
  homepage: https://github.com/ActiveInferenceInstitute/ATLAS

institute:
  affiliation: institute
  category: research
  status: active
  maturity: released
  steward: Active Inference Institute

ecosystem:
  relations:
  - repo: ActiveInferenceInstitute/InstituteOS
    relation: referenced-by
    note: Federated via the InstituteOS .aii manifest.
  - repo: docxology/ATLAS
    relation: references
    note: Public reference fork; the initial implementation was ported from it.
  - repo: ActiveInferenceInstitute/Generalized_Notation_Notation
    relation: references
    note: >-
      Ecosystem notation for active inference generative models; the docs link
      its integration guides at the pinned v5.0.3 revision. ATLAS carries no
      GNN model and no GNN dependency.
  - repo: ActiveInferenceInstitute/Active_Inference_Ontology
    relation: references
    note: >-
      Controlled vocabulary of active inference concepts; the docs link it.
      No ATLAS identifier mapping exists.
  - repo: ActiveInferenceInstitute/AEOS
    relation: references
    note: >-
      Domain ontology for scientific ecosystems; the docs link it. No ATLAS
      identifier mapping exists.
  links:
    github: https://github.com/ActiveInferenceInstitute/ATLAS
    website: https://www.activeinference.org
    docs: docs/index.md

artifacts:
- path: src/atlas
  kind: code
  description: ATLAS knowledge management package.
- path: tests
  kind: code
  description: Test suite.
- path: pyproject.toml
  kind: code
  description: Package metadata, dependency extras, and pytest configuration.
- path: README.md
  kind: doc
  description: Repository overview.
- path: docs/index.md
  kind: doc
  description: Documentation index.
- path: CITATION.cff
  kind: doc
  description: Machine-readable citation metadata.

provenance:
  license: CC-BY-4.0
  citation:
    text: Active Inference Institute — ATLAS.
  current_release: ""
  releases_manifest: ""

instituteos:
  dashboard_mode: repos
  registries: []
  tags:
  - atlas
  - knowledge-management
  - python

capabilities:
- python
- knowledge-management
- documentation

integration:
  analytics: false
  dashboard: false
  sync: pull

tasks:
  inventory:
    cmd: git ls-files
    description: List tracked files.
  validate:
    cmd: python -m instituteos.platform.aii_sidecar.validate .
    description: Validate this sidecar against the aii-sidecar/v1 schema.
  qa:
    cmd: python3 scripts/docs_qa.py
    description: Run the documentation QA gate (whitespace, links, YAML).
  test:
    cmd: python -m pytest
    description: Run the test suite.

docs:
  - docs/README.md
