# AII sidecar — InstituteOS metadata. Schema: aii_platform.aii_sidecar
meta:
  sidecar_version: 1.2.1
  updated: '2026-11-11'
repo:
  name: ATLAS
  slug: atlas
  full_name: ActiveInferenceInstitute/ATLAS
  description: Knowledge management system and project materials repository of the
    Active Inference Institute.
  homepage: https://github.com/ActiveInferenceInstitute/ATLAS
institute:
  category: research
  status: active
  maturity: released
  steward: Active Inference Institute
ecosystem:
  relations:
  - repo: ActiveInferenceInstitute/InstituteOS
    relation: referenced-by
    note: Federated via the InstituteOS .aii manifest.
  - repo: docxology/ATLAS
    note: Public reference fork; the initial implementation was ported from it.
  - repo: ActiveInferenceInstitute/Generalized_Notation_Notation
    note: Ecosystem notation for active inference generative models; the docs link
      its integration guides at the pinned v5.0.3 revision. ATLAS carries no GNN model
      and no GNN dependency.
  - repo: ActiveInferenceInstitute/Active_Inference_Ontology
    note: Controlled vocabulary of active inference concepts; the docs link it. No
      ATLAS identifier mapping exists.
  - repo: ActiveInferenceInstitute/AEOS
    note: Domain ontology for scientific ecosystems; the docs link it. No ATLAS identifier
      mapping exists.
  links:
    github: https://github.com/ActiveInferenceInstitute/ATLAS
    website: https://www.activeinference.org
    docs: docs/index.md
    homepage: https://github.com/ActiveInferenceInstitute/ATLAS
artifacts:
- path: src/atlas
  kind: code
  description: ATLAS knowledge management package.
- path: tests
  kind: code
  description: Test suite.
- path: pyproject.toml
  kind: code
  description: Package metadata, dependency extras, and pytest configuration.
- path: README.md
  kind: doc
  description: Repository overview.
- path: docs/index.md
  kind: doc
  description: Documentation index.
- path: CITATION.cff
  kind: doc
  description: Machine-readable citation metadata.
- path: AGENTS.md
  kind: doc
  description: Agent guidance.
- path: LICENSE
  kind: doc
  description: License.
- path: src
  kind: code
  description: Source tree.
- path: docs
  kind: doc
  description: Documentation tree.
provenance:
  license: CC-BY-4.0
  citation:
    text: Active Inference Institute — ATLAS.
instituteos:
  tags:
  - atlas
  - knowledge-management
  - python
capabilities:
- python
- knowledge-management
- documentation
- python-package
- tested
- ci
- citation
tasks:
  inventory:
    cmd: git ls-files
    description: List tracked files.
  validate:
    cmd: python -m aii_platform.aii_sidecar.validate . --completeness
    description: Validate this sidecar against the aii-sidecar/v1 schema.
  qa:
    cmd: python3 scripts/docs_qa.py
    description: Run the documentation QA gate (whitespace, links, YAML).
  test:
    cmd: python -m pytest
    description: Run the test suite.
integration:
  analytics: false
  dashboard: false
docs:
- docs/README.md
- README.md
- AGENTS.md
- docs/INTEGRATION.md
- docs/AGENTS.md
schema: aii-sidecar/v1
